<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE RUN SUNNY 2026 - Phase 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #6f42c1; --sunny-yellow: #ffeb3b; --sunny-orange: #ff9800; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Prompt', sans-serif; min-height: 100vh; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .main-logo { max-width: 100%; height: auto; border-radius: 15px; }
        
        /* Dashboard สวยๆ */
        .total-km-box { background: linear-gradient(45deg, #6f42c1, #e91e63); color: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .progress { height: 12px; border-radius: 10px; background-color: #e9ecef; margin: 10px 0; }
        .progress-bar { border-radius: 10px; }
        
        /* Level Badge */
        .level-badge { font-size: 0.8rem; padding: 4px 12px; border-radius: 50px; font-weight: 600; display: inline-block; margin-bottom: 5px; }
        .lvl-newbie { background: #e0e0e0; color: #616161; }
        .lvl-hunter { background: #fff9c4; color: #fbc02d; border: 1px solid #fbc02d; }
        .lvl-legend { background: #f3e5f5; color: #7b1fa2; border: 1px solid #7b1fa2; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #6f42c1, #8e44ad); }
        #reader { width: 100%; min-height: 300px; background: #000; border-radius: 20px; border: 4px solid #fff; }
        .btn-checkpoint { height: 75px; font-size: 1.1rem; font-weight: 600; border-radius: 20px; display: none; margin-bottom: 10px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        
        /* E-Certificate Modal Preview */
        #certPreview { border: 10px solid #6f42c1; padding: 30px; background: white; position: relative; display: none; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="container py-3">
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/tammila2011-bot/marathon-checkin/main/loco.png" alt="FREE RUN SUNNY 2026" class="main-logo shadow-sm">
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-pill shadow-sm overflow-auto flex-nowrap">
        <li class="nav-item"><button class="nav-link active" id="btn-tab-reg" data-bs-toggle="pill" data-bs-target="#tab-reg">1. ลงทะเบียน</button></li>
        <li class="nav-item"><button class="nav-link" id="btn-tab-run" data-bs-toggle="pill" data-bs-target="#tab-run">2. สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" id="btn-tab-stat" data-bs-toggle="pill" data-bs-target="#tab-stat" onclick="fetchDataFromCloud()">3. อันดับนักวิ่ง</button></li>
        <li class="nav-item"><button class="nav-link" id="btn-tab-me" data-bs-toggle="pill" data-bs-target="#tab-me">4. สถิติฉัน</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-reg">
            <div class="card p-4 mx-auto" style="max-width: 450px;">
                <h5 class="mb-4 fw-bold text-center text-primary">ยินดีต้อนรับนักวิ่งใหม่</h5>
                <form id="regForm">
                    <div class="mb-3"><label class="form-label">เลข BIB</label><input type="text" id="regBib" class="form-control form-control-lg" required></div>
                    <div class="mb-3"><label class="form-label">ชื่อ-นามสกุล</label><input type="text" id="regName" class="form-control form-control-lg" required></div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">บันทึกและเริ่มสะสมระยะ</button>
                </form>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-run">
            <div class="card p-4 mx-auto" style="max-width: 500px;">
                <input type="text" id="scanBib" class="form-control form-control-lg text-center mb-3 border-primary fw-bold" placeholder="เลข BIB">
                <div id="reader" class="mb-3"></div>
                <div class="d-grid gap-2 mb-3">
                    <button id="startScanBtn" class="btn btn-dark py-2 rounded-pill" onclick="startScanner()">📸 เปิดกล้อง</button>
                    <button id="stopScanBtn" class="btn btn-outline-danger py-2 rounded-pill" onclick="stopScanner()" style="display:none;">ปิดกล้อง</button>
                </div>
                <div id="scanStatus" class="alert alert-secondary text-center rounded-4 small">พร้อมเช็คอิน...</div>
                <div id="btnArea">
                    <button id="btnA" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('A')">บันทึกจุด A</button>
                    <button id="btnB" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('B')">บันทึกจุด B</button>
                    <button id="btnC" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('C')">บันทึกจุด C</button>
                    <button id="btnD" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('D')">บันทึกจุด D</button>
                    <button id="btnE" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('E')">บันทึกจุด E</button>
                    <button id="btnF" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('F')">บันทึกจุด F</button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-stat">
            <div class="card p-4">
                <div class="total-km-box shadow">
                    <small>รวมพลังเดิน-วิ่งชาวซันนี่</small>
                    <h1 class="fw-bold mb-0"><span id="grandTotalKm">0.00</span> กม.</h1>
                </div>
                
                <h6 class="fw-bold mb-3">🏆 ตารางอันดับนักวิ่ง</h6>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <tbody id="top10Body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-me">
            <div class="card p-4 mx-auto text-center" style="max-width: 500px;">
                <div class="input-group mb-4">
                    <input type="text" id="myBibSearch" class="form-control text-center fw-bold" placeholder="ระบุเลข BIB">
                    <button class="btn btn-primary" onclick="loadMyStats()">ดูสถิติ</button>
                </div>
                
                <div id="myResultArea" style="display:none;">
                    <div id="myLevelBadge" class="level-badge">-</div>
                    <h4 id="myNameDisplay" class="fw-bold text-primary mb-1">-</h4>
                    <div id="myMedalDisplay" style="font-size:3rem;">🏃‍♂️</div>
                    
                    <div class="px-4">
                        <div class="progress">
                            <div id="myProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%"></div>
                        </div>
                        <div class="d-flex justify-content-between small text-muted mb-3">
                            <span>0 กม.</span>
                            <span class="fw-bold text-dark"><span id="myDistDisplay">0.00</span> / 100 กม.</span>
                        </div>
                    </div>

                    <div id="certButtonArea" class="mb-4" style="display:none;">
                        <button class="btn btn-warning w-100 fw-bold shadow-sm py-2" onclick="showCertificate()">🎖️ รับเกียรติบัตรออนไลน์</button>
                    </div>

                    <div id="myHistoryList" class="text-start"></div>
                </div>

                <div id="certPreview" class="mt-4 shadow-lg text-center">
                    <h2 class="text-primary fw-bold">FREE RUN SUNNY 2026</h2>
                    <p class="mb-4">ขอเกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า</p>
                    <h1 id="certName" class="fw-bold">-</h1>
                    <p>เลข BIB: <span id="certBib">-</span></p>
                    <hr>
                    <p>พิชิตระยะทางรวม</p>
                    <h2 id="certDist" class="text-success fw-bold">0.00 กม.</h2>
                    <p class="mt-4 small text-muted">"เดิน วิ่ง เมื่อไหร่ก็ได้"</p>
                    <button class="btn btn-sm btn-dark mt-3" onclick="this.parentElement.style.display='none'">ปิดหน้าต่าง</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvZHGKjK55cOMrBYtrkBisTUVSLrKTnqvmn6wYhzkdvAxFlDcjB286H0fhWNiVtOTu/exec";
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    
    let html5QrCode, activeSession = null, localRunners = JSON.parse(localStorage.getItem('runners_local')) || {};

    function speak(t) { if ('speechSynthesis' in window) { const m = new SpeechSynthesisUtterance(t); m.lang = 'th-TH'; window.speechSynthesis.speak(m); } }
    
    // --- 🏆 ระบบเหรียญและเลเวล ---
    function getLevelInfo(d) {
        if (d >= 100) return { title: 'จอมอึดแห่งซันนี่', class: 'lvl-legend', medal: '🥇', greet: 'ยินดีต้อนรับท่านจอมอึด' };
        if (d >= 50) return { title: 'นักล่าระยะ', class: 'lvl-hunter', medal: '🥈', greet: 'ยินดีต้อนรับท่านนักล่า' };
        if (d >= 20) return { title: 'นักวิ่งขาแรง', class: 'lvl-hunter', medal: '🥉', greet: 'สแกนสำเร็จแล้วค่ะ' };
        return { title: 'นักวิ่งมือใหม่', class: 'lvl-newbie', medal: '🏃‍♂️', greet: 'สแกนสำเร็จแล้วค่ะ' };
    }

    // --- 📊 ดึงข้อมูล Dashboard ---
    async function fetchDataFromCloud() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {}, names = {}, grandTotal = 0;
            rows.slice(1).forEach(r => {
                const bib = r[2], name = r[3], d = parseFloat(r[5] || 0);
                if(bib && name) names[bib] = name;
                if(r[1] === 'RUN') {
                    summary[bib] = (summary[bib] || 0) + d;
                    grandTotal += d;
                }
            });
            document.getElementById('grandTotalKm').innerText = grandTotal.toFixed(2);
            const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            document.getElementById('top10Body').innerHTML = sorted.map(([bib, d], i) => {
                const info = getLevelInfo(d);
                const progress = Math.min(d, 100);
                return `<tr>
                    <td>${i+1}</td>
                    <td><span class="badge bg-dark">${bib}</span><br><small class="text-muted">${info.title}</small></td>
                    <td><b>${names[bib]}</b><div class="progress" style="height:5px;"><div class="progress-bar bg-primary" style="width:${progress}%"></div></div></td>
                    <td class="text-end fw-bold">${d.toFixed(2)}</td>
                </tr>`;
            }).join('');
        } catch(e) {}
        showLoading(false);
    }

    // --- 👤 สถิติส่วนตัว ---
    async function loadMyStats() {
        const bib = document.getElementById('myBibSearch').value;
        if(!bib) return;
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let total = 0, name = "นักวิ่ง", histHtml = [];
            
            rows.slice(1).forEach(r => {
                if(r[2] == bib) {
                    name = r[3];
                    if(r[1] === 'RUN') {
                        const d = parseFloat(r[5] || 0);
                        total += d;
                        
                        // --- ส่วนที่ดึง วัน/เวลา กลับมาแสดงผล ---
                        const dateObj = new Date(r[0]);
                        const dateStr = dateObj.toLocaleDateString('th-TH', { day:'numeric', month:'short' });
                        const timeStr = dateObj.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
                        
                        histHtml.unshift(`
                            <div class="p-2 border-bottom d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-light text-dark" style="font-size: 0.7rem;">${dateStr} | ${timeStr}</span><br>
                                    <small class="text-muted">${r[4]} ➔ ${r[7]}</small>
                                </div>
                                <div class="fw-bold text-success">+${d.toFixed(2)} กม.</div>
                            </div>
                        `);
                    }
                }
            });
            
            const info = getLevelInfo(total);
            document.getElementById('myNameDisplay').innerText = name;
            document.getElementById('myDistDisplay').innerText = total.toFixed(2);
            document.getElementById('myMedalDisplay').innerText = info.medal;
            document.getElementById('myLevelBadge').innerText = info.title;
            document.getElementById('myLevelBadge').className = 'level-badge ' + info.class;
            document.getElementById('myProgressBar').style.width = Math.min(total, 100) + '%';
            
            // แสดงรายการประวัติพร้อมวันเวลา
            document.getElementById('myHistoryList').innerHTML = `<h6 class="fw-bold mt-3 px-2">ประวัติเวลาสะสม:</h6>` + (histHtml.join('') || "ไม่มีข้อมูล");
            
            document.getElementById('certButtonArea').style.display = total >= 20 ? 'block' : 'none';
            document.getElementById('myResultArea').style.display = 'block';
            speak("ดึงข้อมูลสำเร็จแล้วค่ะคุณ " + name);
        } catch(e) { console.error(e); }
        showLoading(false);
    }
   

    function showCertificate() {
        document.getElementById('certName').innerText = document.getElementById('myNameDisplay').innerText;
        document.getElementById('certBib').innerText = document.getElementById('myBibSearch').value;
        document.getElementById('certDist').innerText = document.getElementById('myDistDisplay').innerText + " กม.";
        document.getElementById('certPreview').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    // --- ระบบอื่นๆ (สืบทอดจาก Phase 2) ---
    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value, name = document.getElementById('regName').value;
        showLoading(true);
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
            localRunners[bib] = { name: name };
            localStorage.setItem('runners_local', JSON.stringify(localRunners));
            document.getElementById('scanBib').value = bib;
            speak("ลงทะเบียนสำเร็จค่ะคุณ " + name);
            bootstrap.Tab.getOrCreateInstance(document.querySelector('#btn-tab-run')).show();
        } catch(e) {}
        showLoading(false);
    };

    async function startScanner() {
        const cams = await Html5Qrcode.getCameras();
        if (cams.length > 0) {
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('stopScanBtn').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                try {
                    const p = new URL(text).searchParams.get("point");
                    if (p && pointNames[p]) { handleScannedPoint(p); stopScanner(); }
                } catch(e) {}
            });
        }
    }

    function stopScanner() { if (html5QrCode?.isScanning) html5QrCode.stop().then(() => { document.getElementById('startScanBtn').style.display = 'block'; document.getElementById('stopScanBtn').style.display = 'none'; }); }

    function handleScannedPoint(p) {
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        document.getElementById('btn' + p).style.display = 'block';
        document.getElementById('scanStatus').innerText = "📍 พบจุด: " + pointNames[p];
        speak("พบจุดเช็คอิน " + pointNames[p]);
    }

  async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value;
        if(!bib) return alert('กรุณาใส่เลข BIB ก่อนครับ');
        const name = localRunners[bib]?.name || 'นักวิ่ง';
        
        // เช็คเลเวลเพื่อเปลี่ยนเสียงพูด
        const currentDist = parseFloat(document.getElementById('myDistDisplay').innerText || 0);
        const info = getLevelInfo(currentDist);

        if(!activeSession) {
            // บันทึกจุดเริ่มต้น และเก็บเวลาเริ่มต้นไว้ในเครื่อง (ISO String)
            activeSession = { 
                start: code, 
                bib: bib, 
                startTime: new Date().toISOString() 
            };
            speak(info.greet + " บันทึกจุดเริ่มที่ " + pointNames[code] + " ให้แล้วค่ะ");
            document.getElementById('scanStatus').innerText = "📍 กำลังวิ่งจาก: " + pointNames[code];
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) return alert("คุณอยู่ที่จุดเดิมครับ");
            
            showLoading(true);
            try {
                // ส่งข้อมูลไป Google Sheets (เพิ่มฟิลด์ startTime เพื่อบันทึกลงคอลัมน์ที่ 7)
                const payload = { 
                    action: 'record', 
                    bib: bib, 
                    name: name, 
                    start: activeSession.start, 
                    end: code, 
                    distance: dist,
                    startTime: activeSession.startTime // ส่งเวลาเริ่มไปด้วย
                };

                await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(payload) 
                });

                speak("ยอดเยี่ยมมากค่ะคุณ " + name + " ถึงจุด " + pointNames[code] + " ระยะทางเพิ่มขึ้น " + dist + " กิโลเมตร");
                
                // เซ็ตจุดปัจจุบันให้เป็นจุดเริ่มต้นของรอบต่อไปทันที
                activeSession = { 
                    start: code, 
                    bib: bib, 
                    startTime: new Date().toISOString() 
                };
                document.getElementById('scanStatus').innerText = "📍 จุดล่าสุด: " + pointNames[code];
                
            } catch(e) {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + e);
            }
            showLoading(false);
        }
    }
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let totalDist = 0, name = "นักวิ่ง", histHtml = [];
            
            // ค้นหาข้อมูลของนักวิ่งตาม BIB
            const myRows = rows.slice(1).filter(r => r[2] == bib);
            if(myRows.length > 0) name = myRows[0][3];

            myRows.forEach(r => {
                if(r[1] === 'RUN') {
                    const dist = parseFloat(r[5] || 0);
                    totalDist += dist;
                    
                    // คำนวณเวลาที่ใช้ (จาก Timestamp จุดเริ่ม และ จุดจบ)
                    const startTime = new Date(r[6]); // คอลัมน์จุดเริ่ม
                    const endTime = new Date(r[0]);   // คอลัมน์ที่บันทึก (Timestamp)
                    const diffMs = endTime - startTime;
                    const diffMin = diffMs / 1000 / 60; // แปลงเป็นนาที
                    
                    // คำนวณ Pace (นาทีต่อกิโลเมตร)
                    let paceStr = "N/A";
                    if(dist > 0 && diffMin > 0) {
                        const paceDec = diffMin / dist;
                        const pMin = Math.floor(paceDec);
                        const pSec = Math.round((paceDec - pMin) * 60);
                        paceStr = `${pMin}:${pSec.toString().padStart(2, '0')}`;
                    }

                    const timeDisplay = endTime.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
                    const dateDisplay = endTime.toLocaleDateString('th-TH', { day:'numeric', month:'short' });

                    histHtml.unshift(`
                        <div class="card mb-2 border-0 shadow-sm p-3" style="border-radius:15px; background: #fff;">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="badge bg-primary-subtle text-primary rounded-pill">${dateDisplay} | ${timeDisplay} น.</span>
                                <span class="fw-bold text-success" style="font-size:1.1rem;">+${dist.toFixed(2)} กม.</span>
                            </div>
                            <div class="row g-0 small text-muted">
                                <div class="col-6">📍 <b>เริ่ม:</b> ${pointNames[r[4]] || r[4]}</div>
                                <div class="col-6 text-end">🏁 <b>ถึง:</b> ${pointNames[r[7]] || r[7]}</div>
                                <div class="col-6 mt-1">⏱️ <b>เวลาที่ใช้:</b> ${Math.floor(diffMin)} นาที</div>
                                <div class="col-6 mt-1 text-end text-danger">🏃‍♂️ <b>Pace:</b> ${paceStr} min/km</div>
                            </div>
                        </div>
                    `);
                }
            });

            // อัปเดตการแสดงผล (เหมือนเดิมแต่เพิ่มข้อมูลใหม่)
            const info = getLevelInfo(totalDist);
            document.getElementById('myNameDisplay').innerText = name;
            document.getElementById('myDistDisplay').innerText = totalDist.toFixed(2);
            document.getElementById('myMedalDisplay').innerText = info.medal;
            document.getElementById('myLevelBadge').innerText = info.title;
            document.getElementById('myLevelBadge').className = 'level-badge ' + info.class;
            document.getElementById('myProgressBar').style.width = Math.min(totalDist, 100) + '%';
            document.getElementById('myHistoryList').innerHTML = `<h6 class="fw-bold mt-2 mb-3">เจาะลึกการวิ่งของคุณ:</h6>` + (histHtml.join('') || "ยังไม่มีประวัติการวิ่ง");
            
            document.getElementById('certButtonArea').style.display = totalDist >= 20 ? 'block' : 'none';
            document.getElementById('myResultArea').style.display = 'block';
            speak("ดึงข้อมูลสำเร็จแล้วค่ะคุณ " + name);
        } catch(e) { console.error(e); }
        showLoading(false);
    }

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
