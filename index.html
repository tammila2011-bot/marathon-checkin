<script>
    // --- ส่วนของ Script ที่มีการปรับเปลี่ยนเสียงทักทาย ---

    // 1. เสียงเมื่อกล้องสแกนเจอ QR (ก่อนกดปุ่ม)
    async function handleScannedPoint(p) {
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        const btn = document.getElementById('btn' + p);
        if (btn) { 
            btn.style.display = 'block'; 
            document.getElementById('scanStatus').innerText = "📍 พบจุด: " + pointNames[p]; 
            
            // เพิ่มเสียงทักทายเมื่อพบจุด
            const bib = document.getElementById('scanBib').value.trim();
            const name = await getNameFromDatabase(bib);
            speak("พบจุดสแกนที่ " + pointNames[p] + " ของคุณ " + name + " ค่ะ");
        }
    }

    // 2. เสียงเมื่อกดปุ่มบันทึกสำเร็จ
    async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value.trim();
        if(!bib) return alert('ระบุ BIB');
        showLoading(true);
        const name = await getNameFromDatabase(bib);
        const now = new Date();
        
        if(!activeSession) {
            activeSession = { start: code, bib: bib, startTime: now.toISOString() };
            speak("เริ่มบันทึกจากจุด " + pointNames[code] + " เรียบร้อยแล้ว วิ่งต่อไปได้ค่ะคุณ " + name);
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: code, end: code, distance: 0 }) });
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) { showLoading(false); return speak("อยู่ที่จุดเดิมค่ะคุณ " + name); }
            
            // ประโยคที่คุณชอบ: บันทึกเรียบร้อย วิ่งต่อไปได้ค่ะ
            speak("บันทึกจุดสแกนที่ " + pointNames[code] + " เรียบร้อยแล้ว ระยะเพิ่ม " + dist + " กิโลเมตร วิ่งต่อไปได้ค่ะคุณ " + name + " สู้ๆ นะคะ");
            
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: activeSession.start, end: code, distance: dist, startTime: activeSession.startTime }) });
                activeSession = { start: code, bib: bib, startTime: now.toISOString() };
            } catch(e) {}
        }
        showLoading(false);
    }

    // ส่วนของ loadMyStats และ fetchDataFromCloud ยังคงรายงานอันดับและโชว์ Pace เหมือนเดิมครับ
</script>
