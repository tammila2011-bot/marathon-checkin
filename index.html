<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE RUN SUNNY 2026 - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #6f42c1; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Prompt', sans-serif; min-height: 100vh; }
        .card { border: none; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); background: rgba(255, 255, 255, 0.95); margin-bottom: 20px; }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .main-logo { max-width: 100%; height: auto; border-radius: 15px; }
        .total-km-box { background: linear-gradient(45deg, #6f42c1, #e91e63); color: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #6f42c1, #8e44ad); }
        #reader { width: 100%; min-height: 280px; background: #000; border-radius: 15px; overflow: hidden; }
        .btn-checkpoint { height: 65px; font-size: 1.1rem; font-weight: 600; border-radius: 15px; display: none; margin-bottom: 8px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .history-card { border-radius: 12px; border: 1px solid #eee; background: #fff; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; }
        .btn-voice-unlock { background: #fff; border: 2px solid #6f42c1; color: #6f42c1; border-radius: 50px; padding: 5px 20px; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .cert-btn { display: none; margin-top: 15px; font-weight: 600; border-radius: 12px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="container py-3">
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/tammila2011-bot/marathon-checkin/main/loco.png" alt="FREE RUN SUNNY" class="main-logo shadow-sm">
    </div>

    <div class="text-center mb-3">
        <button id="voiceBtn" class="btn-voice-unlock shadow-sm" onclick="unlockAudio()">🔊 กดเปิดระบบเสียงทักทาย</button>
    </div>

    <ul class="nav nav-pills nav-fill mb-3 bg-white p-1 rounded-pill shadow-sm overflow-auto flex-nowrap" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-reg" type="button">1. ลงทะเบียน</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-run" type="button">2. สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stat" type="button" onclick="fetchDataFromCloud()">3. อันดับรวม</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-me" type="button">4. สถิติฉัน</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-reg">
            <div class="card p-4 mx-auto" style="max-width: 400px;">
                <h6 class="mb-3 fw-bold text-center text-primary">ลงทะเบียนนักวิ่งใหม่ (เช่น A123)</h6>
                <form id="regForm">
                    <div class="mb-3"><label class="form-label small">เลข BIB</label><input type="text" id="regBib" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label small">ชื่อ-นามสกุล</label><input type="text" id="regName" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">ลงทะเบียน</button>
                </form>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-run">
            <div class="card p-3 mx-auto" style="max-width: 500px;">
                <input type="text" id="scanBib" class="form-control text-center mb-3 border-primary fw-bold" placeholder="ระบุเลข BIB">
                <div id="reader" class="mb-3"></div>
                <div class="d-grid gap-2 mb-3">
                    <button id="startScanBtn" class="btn btn-dark btn-sm rounded-pill" onclick="startScanner()">📸 เปิดกล้อง</button>
                    <button id="stopScanBtn" class="btn btn-outline-danger btn-sm rounded-pill" onclick="stopScanner()" style="display:none;">ปิดกล้อง</button>
                </div>
                <div id="scanStatus" class="alert alert-light text-center py-2 border rounded-4 small">พร้อมเช็คอิน...</div>
                <div id="btnArea">
                    <button id="btnA" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('A')">บันทึกจุด A</button>
                    <button id="btnB" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('B')">บันทึกจุด B</button>
                    <button id="btnC" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('C')">บันทึกจุด C</button>
                    <button id="btnD" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('D')">บันทึกจุด D</button>
                    <button id="btnE" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('E')">บันทึกจุด E</button>
                    <button id="btnF" class="btn btn-success btn-checkpoint w-100" onclick="checkPoint('F')">บันทึกจุด F</button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-stat">
            <div class="card p-3">
                <div class="total-km-box shadow-sm">
                    <small>รวมพลังเดิน-วิ่งชาวซันนี่</small>
                    <h2 class="fw-bold mb-0"><span id="grandTotalKm">0.00</span> กม.</h2>
                </div>
                <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-sm align-middle">
                        <tbody id="top10Body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-me">
            <div class="card p-3 mx-auto text-center" style="max-width: 500px;">
                <div class="input-group mb-3">
                    <input type="text" id="myBibSearch" class="form-control text-center fw-bold" placeholder="ระบุเลข BIB">
                    <button class="btn btn-primary" onclick="loadMyStats()">ดูสถิติ</button>
                </div>
                <div id="myResultArea" style="display:none;">
                    <h5 id="myNameDisplay" class="fw-bold text-primary mb-1">-</h5>
                    <div id="myMedalDisplay" style="font-size:3rem; margin:10px 0;">🏃‍♂️</div>
                    
                    <div id="certArea">
                        <a id="btnCertBronze" href="#" class="btn btn-warning cert-btn w-100 shadow-sm" style="background:#cd7f32; border:none; color:white;">📜 รับเกียรติบัตร 20 กม.</a>
                        <a id="btnCertSilver" href="#" class="btn btn-secondary cert-btn w-100 shadow-sm" style="background:#c0c0c0; border:none; color:white;">📜 รับเกียรติบัตร 50 กม.</a>
                        <a id="btnCertGold" href="#" class="btn btn-warning cert-btn w-100 shadow-sm" style="background:#ffd700; border:none; color:black;">📜 รับเกียรติบัตรผู้พิชิต 100 กม.</a>
                    </div>

                    <div class="px-3 mt-3">
                        <div class="progress" style="height:12px; background:#eee; border-radius:10px; margin:10px 0;">
                            <div id="myProgressBar" class="progress-bar bg-success" style="width: 0%; border-radius:10px;"></div>
                        </div>
                        <div class="d-flex justify-content-between small text-muted mb-3">
                            <span>0 กม.</span><span class="fw-bold text-dark"><span id="myDistDisplay">0.00</span> / 100 กม.</span>
                        </div>
                    </div>
                    <div id="myHistoryList" class="text-start"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4wv2JxM3PAqFFNhxMypPmvv1jWtE1Lv3_GO5ZI_Sm9UrxQd054pbpOGk5dnGqk8NZ/exec";
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    
    let html5QrCode, activeSession = null, localRunners = JSON.parse(localStorage.getItem('runners_local')) || {};

    // --- กล้อง ---
    async function startScanner() {
        try {
            const cams = await Html5Qrcode.getCameras();
            if (cams && cams.length > 0) {
                document.getElementById('startScanBtn').style.display = 'none';
                document.getElementById('stopScanBtn').style.display = 'block';
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                    try {
                        const url = new URL(text);
                        const p = url.searchParams.get("point");
                        if (p && pointNames[p]) {
                            const bib = document.getElementById('scanBib').value.trim();
                            const name = localRunners[bib]?.name || '';
                            speak("พบจุด " + pointNames[p] + (name ? " ของคุณ " + name : ""));
                            handleScannedPoint(p);
                            stopScanner();
                        }
                    } catch(e) {}
                });
            }
        } catch (err) { alert("กล้องมีปัญหา: " + err); }
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('startScanBtn').style.display = 'block';
                document.getElementById('stopScanBtn').style.display = 'none';
            });
        }
    }

    function handleScannedPoint(p) {
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        const btn = document.getElementById('btn' + p);
        if (btn) { btn.style.display = 'block'; document.getElementById('scanStatus').innerText = "📍 พบจุด: " + pointNames[p]; }
    }

    // --- บันทึกจุด (Pace A->B) ---
    async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value.trim();
        if(!bib) return alert('ระบุ BIB');
        const name = localRunners[bib]?.name || 'นักวิ่ง';
        const now = new Date();
        if(!activeSession) {
            activeSession = { start: code, bib: bib, startTime: now.toISOString() };
            speak("เริ่มบันทึกจากจุด " + pointNames[code] + " คุณ " + name);
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: code, end: code, distance: 0 }) });
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) return speak("อยู่ที่จุดเดิมค่ะ");
            speak("ถึงจุด " + pointNames[code] + " ระยะ " + dist + " กิโลเมตร เก่งมากค่ะคุณ " + name);
            showLoading(true);
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: activeSession.start, end: code, distance: dist, startTime: activeSession.startTime }) });
                activeSession = { start: code, bib: bib, startTime: now.toISOString() };
            } catch(e) {}
            showLoading(false);
        }
    }

    // --- ลงทะเบียน (ป้องกันซ้ำ) ---
    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value.trim();
        const name = document.getElementById('regName').value.trim();
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            const isDup = rows.slice(1).some(r => String(r[2]).trim() === String(bib));
            if (isDup) {
                showLoading(false);
                speak("บีไอบีนี้มีคนใช้แล้วค่ะ");
                return alert("เลข BIB นี้มีผู้ใช้งานแล้วครับ");
            }
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
            localRunners[bib] = { name: name };
            localStorage.setItem('runners_local', JSON.stringify(localRunners));
            document.getElementById('scanBib').value = bib;
            speak("ลงทะเบียนสำเร็จค่ะ");
            bootstrap.Tab.getOrCreateInstance(document.querySelector('button[data-bs-target="#tab-run"]')).show();
        } catch(e) {}
        showLoading(false);
    };

    // --- สถิติส่วนตัว (ดึงชื่อล่าสุด + รางวัล) ---
    async function loadMyStats() {
        const inputBib = document.getElementById('myBibSearch').value.trim();
        if(!inputBib) return;
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let totalDist = 0, name = "นักวิ่ง", histArray = [];
            const myRows = rows.slice(1).filter(r => String(r[2]).trim() === String(inputBib));
            if(myRows.length > 0) {
                for(let i = myRows.length-1; i>=0; i--) { if(myRows[i][3]) { name = myRows[i][3]; break; } }
                localRunners[inputBib] = { name: name };
                localStorage.setItem('runners_local', JSON.stringify(localRunners));
                myRows.forEach(r => {
                    if(r[1] === 'RUN') {
                        const dist = parseFloat(r[5] || 0); totalDist += dist;
                        const d = new Date(r[0]), dStr = d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}), tStr = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
                        let ps = "--:--";
                        if (dist > 0 && r[6]) {
                            const diff = new Date(r[0]) - new Date(r[6]);
                            if (diff > 0 && diff < 18000000) {
                                const pd = (diff / 60000) / dist;
                                ps = Math.floor(pd) + ":" + Math.round((pd % 1) * 60).toString().padStart(2, '0');
                            }
                        }
                        histArray.unshift(`<div class="history-card shadow-sm border-start border-primary border-4"><div class="d-flex justify-content-between mb-1"><span class="text-primary fw-bold small">📅 ${dStr} | 🕒 ${tStr}น.</span><span class="badge bg-info text-dark">Pace ${ps}</span><span class="text-success fw-bold">+${dist.toFixed(2)} กม.</span></div><div class="small text-muted text-start">📍 ${pointNames[r[4]] || r[4]} ➡️ ${pointNames[r[7]] || r[7]}</div></div>`);
                    }
                });
                document.getElementById('myNameDisplay').innerText = name;
                document.getElementById('myDistDisplay').innerText = totalDist.toFixed(2);
                document.getElementById('myProgressBar').style.width = Math.min(totalDist, 100) + '%';
                document.getElementById('myHistoryList').innerHTML = `<h6 class="fw-bold mb-2 small mt-3 text-secondary text-start">ประวัติล่าสุด:</h6>` + (histArray.slice(0, 10).join(''));
                document.getElementById('myResultArea').style.display = 'block';

                document.querySelectorAll('.cert-btn').forEach(b => b.style.display = 'none');
                if (totalDist >= 100) {
                    document.getElementById('myMedalDisplay').innerHTML = "🥇🏆🎆";
                    document.getElementById('btnCertGold').style.display = 'block';
                    speak("ยินดีด้วยระดับเหรียญทองค่ะคุณ " + name + " ผู้พิชิต 100 กิโลเมตร");
                    playFireworkSound();
                } else if (totalDist >= 50) {
                    document.getElementById('myMedalDisplay').innerHTML = "🥈✨";
                    document.getElementById('btnCertSilver').style.display = 'block';
                    speak("ยินดีด้วยระดับเหรียญเงินค่ะคุณ " + name);
                } else if (totalDist >= 20) {
                    document.getElementById('myMedalDisplay').innerHTML = "🥉";
                    document.getElementById('btnCertBronze').style.display = 'block';
                    speak("ยินดีด้วยระดับเหรียญทองแดงค่ะคุณ " + name);
                } else {
                    document.getElementById('myMedalDisplay').innerHTML = "🏃‍♂️";
                    speak("ดึงข้อมูลสำเร็จแล้วค่ะคุณ " + name);
                }
            } else { alert("ไม่พบข้อมูล BIB"); }
        } catch(e) {}
        showLoading(false);
    }

    function playFireworkSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        for(let i=0; i<3; i++) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator(); const gn = audioCtx.createGain();
                osc.type = 'square'; osc.connect(gn); gn.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime); gn.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gn.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                osc.start(); osc.stop(audioCtx.currentTime + 1.2);
            }, i * 600);
        }
    }

    async function fetchDataFromCloud() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {}, names = {}, grandTotal = 0;
            rows.slice(1).forEach(r => {
                const bib = String(r[2]).trim(), name = r[3], d = parseFloat(r[5] || 0);
                if(bib && name) names[bib] = name;
                if(r[1] === 'RUN') { summary[bib] = (summary[bib] || 0) + d; grandTotal += d; }
            });
            document.getElementById('grandTotalKm').innerText = grandTotal.toFixed(2);
            const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]).slice(0, 20);
            document.getElementById('top10Body').innerHTML = sorted.map(([bib, d], i) => `<tr><td>${i+1}</td><td><span class="badge bg-dark">${bib}</span></td><td><b>${names[bib]}</b></td><td class="text-end fw-bold text-primary">${d.toFixed(2)}</td></tr>`).join('');
        } catch(e) {}
        showLoading(false);
    }

    function unlockAudio() {
        const msg = new SpeechSynthesisUtterance('พร้อมแล้วค่ะ');
        msg.lang = 'th-TH'; window.speechSynthesis.speak(msg);
        document.getElementById('voiceBtn').innerText = "✅ ระบบเสียงทำงานแล้ว";
        document.getElementById('voiceBtn').className = "btn btn-outline-success btn-sm rounded-pill";
    }

    function speak(t) { 
        if ('speechSynthesis' in window) { 
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t); m.lang = 'th-TH'; window.speechSynthesis.speak(m); 
        } 
    }

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
</script>
</body>
</html>
