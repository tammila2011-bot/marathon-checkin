<script>
    // --- เปลี่ยนลิงก์ใหม่ของอาจารย์ตรงนี้ ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzy-ZwEbMenc0ZBCR_H2EnboPErMMd3IdqeUVrcQy5HaGs5UPM8a1AuUPwfh3mDXvmM/exec";
    
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    
    let html5QrCode, activeSession = null, localRunners = JSON.parse(localStorage.getItem('runners_local')) || {};

    // --- ฟังก์ชันหลักสำหรับเปิดกล้อง (ที่แก้ไขแล้ว) ---
    async function startScanner() {
        try {
            const cams = await Html5Qrcode.getCameras();
            if (cams && cams.length > 0) {
                document.getElementById('startScanBtn').style.display = 'none';
                document.getElementById('stopScanBtn').style.display = 'block';
                
                // สร้าง Instance ใหม่ถ้ายังไม่มี
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: 250 },
                    (text) => {
                        // เมื่อสแกนเจอ URL เช่น https://sunny.com?point=A
                        try {
                            const url = new URL(text);
                            const p = url.searchParams.get("point");
                            if (p && pointNames[p]) {
                                speak("พบจุด " + pointNames[p]);
                                handleScannedPoint(p);
                                stopScanner(); // สแกนเจอแล้วให้ปิดกล้องอัตโนมัติ
                            }
                        } catch(e) {
                            console.log("QR Code ไม่ใช่รูปแบบที่รองรับ");
                        }
                    }
                );
            } else {
                alert("ไม่พบกล้องในอุปกรณ์นี้ครับ");
            }
        } catch (err) {
            console.error("Error starting scanner:", err);
            alert("ไม่สามารถเข้าถึงกล้องได้: " + err);
        }
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('startScanBtn').style.display = 'block';
                document.getElementById('stopScanBtn').style.display = 'none';
            }).catch(err => console.error("Failed to stop scanner", err));
        }
    }

    function handleScannedPoint(p) {
        // ซ่อนปุ่มทั้งหมดก่อน
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        // โชว์เฉพาะปุ่มที่สแกนเจอ
        const targetBtn = document.getElementById('btn' + p);
        if (targetBtn) {
            targetBtn.style.display = 'block';
            document.getElementById('scanStatus').innerText = "📍 พบจุด: " + pointNames[p];
            // เลื่อนหน้าจอลงมาที่ปุ่มเพื่อให้กดง่าย
            targetBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // --- ฟังก์ชันอื่นๆ (Pace, loadStats, checkPoint) คงเดิมตามที่อาจารย์เขียนมา ---
    // (รวมถึงฟังก์ชัน regForm.onsubmit ที่ต้องเพิ่มกลับเข้าไปด้วยครับ)

    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value.trim();
        const name = document.getElementById('regName').value.trim();
        showLoading(true);
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
            localRunners[bib] = { name: name };
            localStorage.setItem('runners_local', JSON.stringify(localRunners));
            document.getElementById('scanBib').value = bib;
            speak("ลงทะเบียนเรียบร้อยค่ะคุณ " + name);
            // เปลี่ยนไปหน้าสแกนจุดอัตโนมัติ
            const runTab = new bootstrap.Tab(document.querySelector('button[data-bs-target="#tab-run"]'));
            runTab.show();
        } catch(e) { alert("เกิดข้อผิดพลาดในการลงทะเบียน"); }
        showLoading(false);
    };

    function unlockAudio() {
        const msg = new SpeechSynthesisUtterance('ระบบเสียงชมรมซันนี่พร้อมแล้วค่ะ');
        msg.lang = 'th-TH';
        window.speechSynthesis.speak(msg);
        document.getElementById('voiceBtn').innerText = "✅ ระบบเสียงทำงานแล้ว";
        document.getElementById('voiceBtn').className = "btn btn-outline-success btn-sm rounded-pill";
    }

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
</script>
