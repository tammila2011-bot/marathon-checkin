<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE RUN SUNNY 2026 - Master Wow v2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #6f42c1; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Prompt', sans-serif; min-height: 100vh; }
        .card { border: none; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); background: rgba(255, 255, 255, 0.95); margin-bottom: 20px; }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .main-logo { max-width: 100%; height: auto; border-radius: 15px; }
        .total-km-box { background: linear-gradient(45deg, #6f42c1, #e91e63); color: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #6f42c1, #8e44ad); }
        #reader { width: 100%; min-height: 280px; background: #000; border-radius: 15px; overflow: hidden; }
        .btn-checkpoint { height: 65px; font-size: 1.1rem; font-weight: 600; border-radius: 15px; display: none; margin-bottom: 8px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .history-card { border-radius: 12px; border: 1px solid #eee; background: #fff; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; text-align: left; }
        .btn-voice-unlock { background: #fff; border: 2px solid #6f42c1; color: #6f42c1; border-radius: 50px; padding: 5px 20px; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .rank-badge { background: #6f42c1; color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 10px; }
        .pagination-btn { border-radius: 10px; margin: 2px; min-width: 45px; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="container py-3">
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/tammila2011-bot/marathon-checkin/main/loco.png" alt="FREE RUN SUNNY" class="main-logo shadow-sm">
    </div>

    <div class="text-center mb-3">
        <button id="voiceBtn" class="btn-voice-unlock shadow-sm" onclick="unlockAudio()">🔊 กดเปิดระบบเสียงทักทาย</button>
    </div>

    <ul class="nav nav-pills nav-fill mb-3 bg-white p-1 rounded-pill shadow-sm overflow-auto flex-nowrap" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-reg" type="button">1. ลงทะเบียน</button></li>
        <li class="nav-item"><button class="nav-link" id="pills-run-tab" data-bs-toggle="pill" data-bs-target="#tab-run" type="button">2. สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stat" type="button" onclick="fetchDataFromCloud()">3. อันดับรวม</button></li>
        <li class="nav-item"><button class="nav-link" id="pills-me-tab" data-bs-toggle="pill" data-bs-target="#tab-me" type="button">4. สถิติฉัน</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-reg">...ส่วนลงทะเบียน...</div>
        <div class="tab-pane fade" id="tab-run">...ส่วนสแกนจุด...</div>
        <div class="tab-pane fade" id="tab-stat">...ส่วนอันดับรวม...</div>

        <div class="tab-pane fade" id="tab-me">
            <div class="card p-3 mx-auto text-center" style="max-width: 500px;">
                <div class="input-group mb-3">
                    <input type="text" id="myBibSearch" class="form-control text-center fw-bold" placeholder="ระบุเลข BIB">
                    <button class="btn btn-primary" onclick="loadMyStats()">ดูสถิติ</button>
                </div>
                <div id="myResultArea" style="display:none;">
                    <div id="myRankDisplay" class="rank-badge">🏆 อันดับที่ --</div>
                    <h5 id="myNameDisplay" class="fw-bold text-primary mb-1">-</h5>
                    <div id="myMedalDisplay" style="font-size:3rem; margin:10px 0;">🏃‍♂️</div>
                    
                    <div id="certArea" class="mt-3" style="display:none;">
                        <button onclick="generateCertificate()" class="btn btn-warning w-100 shadow-sm fw-bold p-3" style="border-radius:15px; background: linear-gradient(45deg, #ffd700, #ff8c00); border:none; color:white; animation: pulse 2s infinite;">📜 รับเกียรติบัตรออนไลน์</button>
                        <canvas id="certCanvas" style="display:none;"></canvas>
                    </div>

                    <div class="px-3 mt-3">
                        <div class="progress" style="height:12px; border-radius:10px; margin-bottom: 5px;">
                            <div id="myProgressBar" class="progress-bar bg-success" style="width: 0%;"></div>
                        </div>
                        <div class="d-flex justify-content-between small text-muted mb-3">
                            <span>0 กม.</span><span class="fw-bold"><span id="myDistDisplay">0.00</span> / 100 กม.</span>
                        </div>
                    </div>
                    <div id="myHistoryList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ส่วน URL และค่าคงที่
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDHbX-H8qObqFKO4s9o2rpWYkRQzYgEpvCi2T2t_20TD3T61SXVBp2Iqq_4NVfWDN_/exec";
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    
    let html5QrCode, activeSession = null;
    let fullSortedData = []; 
    let namesDict = {}; 

    // ฟังก์ชันสำคัญ: loadMyStats (กู้คืน Pace & เส้นทาง)
    async function loadMyStats() {
        const inputBib = document.getElementById('myBibSearch').value.trim();
        if(!inputBib) return;
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {};
            rows.slice(1).forEach(r => {
                if(r[1] === 'RUN') {
                    const b = String(r[2]).trim();
                    summary[b] = (summary[b] || 0) + parseFloat(r[5] || 0);
                }
            });
            const sortedEntries = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            const rankIndex = sortedEntries.findIndex(([bib]) => bib === String(inputBib));
            const myRank = rankIndex !== -1 ? rankIndex + 1 : "--";

            let totalDist = 0, name = "นักวิ่ง", histArray = [];
            const regRow = rows.slice(1).reverse().find(r => r[1] === 'REG' && String(r[2]).trim() === String(inputBib));
            if(regRow) name = regRow[3];

            const myRows = rows.slice(1).filter(r => String(r[2]).trim() === String(inputBib));
            if(myRows.length > 0) {
                myRows.forEach(r => {
                    if(r[1] === 'RUN') {
                        const dist = parseFloat(r[5] || 0); totalDist += dist;
                        const d = new Date(r[0]), dStr = d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}), tStr = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
                        let ps = "--:--";
                        if (dist > 0 && r[6]) {
                            const diff = new Date(r[0]) - new Date(r[6]);
                            if (diff > 0 && diff < 18000000) {
                                const paceDecimal = (diff / 60000) / dist;
                                const pMin = Math.floor(paceDecimal);
                                const pSec = Math.round((paceDecimal - pMin) * 60);
                                ps = pMin + ":" + pSec.toString().padStart(2, '0');
                            }
                        }
                        // คืนค่ารูปแบบประวัติที่มี Pace และ 📍 ➡️
                        histArray.unshift(`
                            <div class="history-card shadow-sm border-start border-primary border-4 p-2 mb-2">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-primary fw-bold small">📅 ${dStr} | 🕒 ${tStr}น.</span>
                                    <span class="badge bg-info text-dark">Pace ${ps}</span>
                                    <span class="text-success fw-bold">+${dist.toFixed(2)} กม.</span>
                                </div>
                                <div class="small text-muted">📍 ${pointNames[r[4]] || r[4]} ➡️ ${pointNames[r[7]] || r[7]}</div>
                            </div>`);
                });
                document.getElementById('myRankDisplay').innerText = "🏆 อันดับที่ " + myRank;
                document.getElementById('myNameDisplay').innerText = name;
                document.getElementById('myDistDisplay').innerText = totalDist.toFixed(2);
                document.getElementById('myProgressBar').style.width = Math.min(totalDist, 100) + '%';
                document.getElementById('myHistoryList').innerHTML = `<h6 class="fw-bold mb-2 small mt-3 text-secondary">ประวัติล่าสุด:</h6>` + histArray.slice(0, 10).join('');
                document.getElementById('myResultArea').style.display = 'block';
                document.getElementById('certArea').style.display = 'block';
                
                if (totalDist < 100) {
                    speak("โอ้โห! ดูอันดับสิคะคุณ " + name + " พุ่งขึ้นมาแล้วนะ! อีกนิดเดียวจะแซงข้างหน้าแล้ว ลุยต่อเลยค่ะ!");
                } else {
                    speak("ยินดีด้วยค่ะคุณวิ่งครบ 100 กิโลเมตรแล้ว เก่งมากค่ะคุณ " + name);
                }
            }
        } catch(e) { console.error(e); }
        showLoading(false);
    }

  // --- บันทึกจุดสแกน + Auto Jump ---
    async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value.trim();
        if(!bib) return alert('ระบุ BIB');
        showLoading(true);
        const name = await getNameFromDatabase(bib);
        const now = new Date();
        
        let msg = "";
        if(!activeSession) {
            activeSession = { start: code, bib: bib, startTime: now.toISOString() };
            msg = "บันทึกจุดสแกนที่ " + pointNames[code] + " เรียบร้อยแล้ว วิ่งต่อไปได้ค่ะคุณ " + name + " สู้ๆ นะคะ";
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: code, end: code, distance: 0 }) });
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) { showLoading(false); return speak("อยู่ที่จุดเดิมค่ะคุณ " + name); }
            msg = "บันทึกจุดสแกนที่ " + pointNames[code] + " เรียบร้อยแล้ว ระยะเพิ่ม " + dist + " กิโลเมตร วิ่งต่อไปได้ค่ะคุณ " + name + " สู้ๆ นะคะ";
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: activeSession.start, end: code, distance: dist, startTime: activeSession.startTime }) });
            activeSession = { start: code, bib: bib, startTime: now.toISOString() };
        }
        
        speak(msg);
        showLoading(false);
        
        setTimeout(() => {
            document.getElementById('myBibSearch').value = bib;
            bootstrap.Tab.getOrCreateInstance(document.getElementById('pills-me-tab')).show();
            loadMyStats(); 
        }, 6000);
    }

    // --- โหลดสถิติฉัน (กู้คืน Pace & Route) ---
    async function loadMyStats() {
        const inputBib = document.getElementById('myBibSearch').value.trim();
        if(!inputBib) return;
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {};
            rows.slice(1).forEach(r => {
                if(r[1] === 'RUN') {
                    const b = String(r[2]).trim();
                    summary[b] = (summary[b] || 0) + parseFloat(r[5] || 0);
                }
            });
            const sortedEntries = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            const rankIndex = sortedEntries.findIndex(([bib]) => bib === String(inputBib));
            const myRank = rankIndex !== -1 ? rankIndex + 1 : "--";

            let totalDist = 0, name = "นักวิ่ง", histArray = [];
            const regRow = rows.slice(1).reverse().find(r => r[1] === 'REG' && String(r[2]).trim() === String(inputBib));
            if(regRow) name = regRow[3];

            const myRows = rows.slice(1).filter(r => String(r[2]).trim() === String(inputBib));
            if(myRows.length > 0) {
                myRows.forEach(r => {
                    if(r[1] === 'RUN') {
                        const dist = parseFloat(r[5] || 0); totalDist += dist;
                        const d = new Date(r[0]), dStr = d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}), tStr = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
                        let ps = "--:--";
                        if (dist > 0 && r[6]) {
                            const diff = new Date(r[0]) - new Date(r[6]);
                            if (diff > 0 && diff < 18000000) {
                                const paceDecimal = (diff / 60000) / dist;
                                const pMin = Math.floor(paceDecimal);
                                const pSec = Math.round((paceDecimal - pMin) * 60);
                                ps = pMin + ":" + pSec.toString().padStart(2, '0');
                            }
                        }
                        // แก้ไขจุดนี้: ใส่ Pace และ เส้นทาง กลับเข้าไป
                        histArray.unshift(`
                            <div class="history-card shadow-sm border-start border-primary border-4 p-2 mb-2">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="text-primary fw-bold small">📅 ${dStr} | 🕒 ${tStr}น.</span>
                                    <span class="badge bg-info text-dark">Pace ${ps}</span>
                                    <span class="text-success fw-bold">+${dist.toFixed(2)} กม.</span>
                                </div>
                                <div class="small text-muted">📍 ${pointNames[r[4]] || r[4]} ➡️ ${pointNames[r[7]] || r[7]}</div>
                            </div>`);
                    }
                });
                document.getElementById('myRankDisplay').innerText = "🏆 อันดับที่ " + myRank;
                document.getElementById('myNameDisplay').innerText = name;
                document.getElementById('myDistDisplay').innerText = totalDist.toFixed(2);
                document.getElementById('myProgressBar').style.width = Math.min(totalDist, 100) + '%';
                document.getElementById('myHistoryList').innerHTML = `<h6 class="fw-bold mb-2 small mt-3 text-secondary">ประวัติล่าสุด:</h6>` + histArray.slice(0, 10).join('');
                document.getElementById('myResultArea').style.display = 'block';
                document.getElementById('certArea').style.display = 'block';

                if (totalDist >= 100) {
                    speak("วินาทีประวัติศาสตร์! ยินดีด้วยค่ะคุณวิ่งครบระยะ 100 กิโลเมตรแล้ว เก่งมากค่ะคุณ " + name);
                } else {
                    speak("โอ้โห! ดูอันดับสิคะคุณ " + name + " พุ่งขึ้นมาแล้วนะ! อีกนิดเดียวจะแซงข้างหน้าแล้ว ลุยต่อเลยค่ะ!");
                }
            }
        } catch(e) { console.error(e); }
        showLoading(false);
    }

    // --- อันดับรวมแบ่งหน้า ---
    async function fetchDataFromCloud() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {}, grandTotal = 0;
            namesDict = {};
            rows.slice(1).forEach(r => {
                const bib = String(r[2]).trim(), type = r[1], val = r[3], d = parseFloat(r[5] || 0);
                if(type === 'REG') namesDict[bib] = val;
                if(type === 'RUN') { summary[bib] = (summary[bib] || 0) + d; grandTotal += d; }
            });
            document.getElementById('grandTotalKm').innerText = grandTotal.toFixed(2);
            fullSortedData = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            changePage(1); 
        } catch(e) {}
        showLoading(false);
    }

    function changePage(pageNo) {
        const pageSize = 30;
        const start = (pageNo - 1) * pageSize;
        const pageData = fullSortedData.slice(start, start + pageSize);
        document.getElementById('top10Body').innerHTML = pageData.map(([bib, d], i) => 
            `<tr><td>${start + i + 1}</td><td><span class="badge bg-dark">${bib}</span></td><td><b>${namesDict[bib] || 'นักวิ่ง'}</b></td><td class="text-end fw-bold text-primary">${d.toFixed(2)}</td></tr>`
        ).join('');
        document.querySelectorAll('.pagination-btn').forEach((btn, idx) => {
            if (idx + 1 === pageNo) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    // --- ใบประกาศ ---
    async function generateCertificate() {
        showLoading(true);
        const canvas = document.getElementById('certCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "anonymous"; 
        img.src = 'https://raw.githubusercontent.com/tammila2011-bot/marathon-checkin/main/Certificate.png'; 
        img.onload = function() {
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0); ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF';
            const name = document.getElementById('myNameDisplay').innerText;
            ctx.font = 'bold 85px "Prompt", sans-serif'; ctx.fillText(name, canvas.width / 2, canvas.height * 0.465); 
            const dist = document.getElementById('myDistDisplay').innerText;
            ctx.font = 'bold 75px "Prompt", sans-serif'; ctx.fillText(dist, canvas.width * 0.355, canvas.height * 0.700); 
            const d = new Date(); const dateStr = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
            ctx.font = '45px "Prompt", sans-serif'; ctx.fillText(dateStr, canvas.width * 0.655, canvas.height * 0.700); 
            const dataUrl = canvas.toDataURL('image/png'); showLoading(false); window.open().document.write('<img src="' + dataUrl + '" style="max-width:100%;">');
        };
    }

    // --- ระบบเสียงและทั่วไป ---
    function unlockAudio() { speak('ระบบเสียงพร้อมทำงานแล้วค่ะ'); document.getElementById('voiceBtn').innerText = "✅ ระบบเสียงทำงานแล้ว"; }
    function speak(t) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = 'th-TH'; window.speechSynthesis.speak(m); } }
    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value.trim();
        const name = document.getElementById('regName').value.trim();
        showLoading(true);
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
        speak("ลงทะเบียนเรียบร้อยค่ะคุณ " + name);
        showLoading(false);
    };  
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
