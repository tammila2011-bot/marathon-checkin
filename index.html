<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE RUN SUNNY 2026 - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #6f42c1; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Prompt', sans-serif; min-height: 100vh; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .nav-pills .nav-link { color: #666; border-radius: 50px; }
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #6f42c1, #8e44ad); box-shadow: 0 4px 15px rgba(111,66,193,0.3); }
        #reader { width: 100%; min-height: 300px; background: #000; border-radius: 20px; overflow: hidden; border: 4px solid #fff; }
        .btn-checkpoint { height: 80px; font-size: 1.1rem; font-weight: 600; border-radius: 20px; display: none; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .badge-bib { background-color: #343a40; padding: 6px 12px; }
        .medal-icon { font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">FREE RUN SUNNY 2026 🏃‍♂️</h2>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-pill shadow-sm">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-reg">1. ลงทะเบียน</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-run">2. สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stat" onclick="fetchDataFromCloud()">3. สถิติรวม</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-reg">
            <div class="card p-4 mx-auto" style="max-width: 450px;">
                <h4 class="mb-4 fw-bold text-center text-primary">ลงทะเบียน</h4>
                <form id="regForm">
                    <div class="mb-3"><label class="form-label">เลข BIB</label><input type="text" id="regBib" class="form-control form-control-lg" required></div>
                    <div class="mb-3"><label class="form-label">ชื่อ-นามสกุล</label><input type="text" id="regName" class="form-control form-control-lg" required></div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">เริ่มวิ่งกันเลย!</button>
                </form>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-run">
            <div class="card p-4 mx-auto" style="max-width: 500px;">
                <h5 class="text-center fw-bold mb-3">📍 บันทึกจุดเช็คอิน</h5>
                <input type="text" id="scanBib" class="form-control form-control-lg text-center mb-3 border-primary fw-bold" placeholder="เลข BIB">
                <div id="reader" class="mb-3"></div>
                <div class="d-grid gap-2 mb-3">
                    <button id="startScanBtn" class="btn btn-dark py-2 rounded-pill" onclick="startScanner()">📸 เปิดกล้อง</button>
                    <button id="stopScanBtn" class="btn btn-outline-danger py-2 rounded-pill" onclick="stopScanner()" style="display:none;">ปิดกล้อง</button>
                </div>
                <div id="scanStatus" class="alert alert-secondary text-center rounded-4 small">ส่อง QR Code เพื่อเช็คอิน</div>
                <div id="btnArea">
                    <button id="btnA" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('A')">เช็คอินจุด A</button>
                    <button id="btnB" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('B')">เช็คอินจุด B</button>
                    <button id="btnC" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('C')">เช็คอินจุด C</button>
                    <button id="btnD" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('D')">เช็คอินจุด D</button>
                    <button id="btnE" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('E')">เช็คอินจุด E</button>
                    <button id="btnF" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('F')">เช็คอินจุด F</button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-stat">
            <div class="card p-4">
                <div class="row mb-3 align-items-center">
                    <div class="col-md-6"><h5 class="fw-bold text-primary mb-0">🏆 อันดับนักวิ่ง</h5></div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="searchBox" class="form-control" placeholder="ค้นหา BIB หรือชื่อ..." onkeyup="filterTable()">
                            <button class="btn btn-outline-primary" onclick="fetchDataFromCloud()">🔄</button>
                        </div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle" id="statTable">
                        <thead class="text-muted small">
                            <tr><th>อันดับ</th><th>BIB</th><th>ชื่อ-นามสกุล</th><th>รางวัล</th><th class="text-end">ระยะทาง</th></tr>
                        </thead>
                        <tbody id="top10Body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvZHGKjK55cOMrBYtrkBisTUVSLrKTnqvmn6wYhzkdvAxFlDcjB286H0fhWNiVtOTu/exec";
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    let html5QrCode, activeSession = null, localRunners = JSON.parse(localStorage.getItem('runners_local')) || {};

    // 📢 ฟังก์ชันระบบเสียงพูด
    function speak(text) {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'th-TH';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }
    }

    // 🥇 ฟังก์ชันคำนวณเหรียญรางวัล
    function getMedal(dist) {
        if (dist >= 10) return '<span class="medal-icon">🥇</span>';
        if (dist >= 5) return '<span class="medal-icon">🥈</span>';
        if (dist >= 2) return '<span class="medal-icon">🥉</span>';
        return '<span class="text-muted small">🏃‍♂️</span>';
    }

    // 🔍 ฟังก์ชันค้นหาในตาราง
    function filterTable() {
        let input = document.getElementById("searchBox").value.toLowerCase();
        let rows = document.getElementById("top10Body").getElementsByTagName("tr");
        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
        }
    }

    async function fetchDataFromCloud() {
        showLoading(true);
        const tbody = document.getElementById('top10Body');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">กำลังอัปเดตข้อมูล...</td></tr>';
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {}, names = {};
            rows.slice(1).forEach(r => {
                const type = r[1], bib = r[2], name = r[3], dist = parseFloat(r[5] || 0);
                if(bib && name) names[bib] = name;
                if(type === 'RUN' && bib) summary[bib] = (summary[bib] || 0) + dist;
            });
            const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            tbody.innerHTML = sorted.map(([bib, d], i) => `
                <tr>
                    <td>${i+1}</td>
                    <td><span class="badge badge-bib">${bib}</span></td>
                    <td class="fw-600">${names[bib] || 'นักวิ่ง'}</td>
                    <td>${getMedal(d)}</td>
                    <td class="text-end fw-bold text-primary">${d.toFixed(2)} กม.</td>
                </tr>`).join('');
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">ขัดข้อง</td></tr>'; }
        showLoading(false);
    }

    // --- ระบบกล้องและการเช็คอิน ---
    async function startScanner() {
        const cameras = await Html5Qrcode.getCameras();
        if (cameras.length > 0) {
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('stopScanBtn').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                try {
                    const p = new URL(text).searchParams.get("point");
                    if (p && pointNames[p]) { handleScannedPoint(p); stopScanner(); }
                } catch(e) {}
            });
        }
    }

    function stopScanner() {
        if (html5QrCode?.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('startScanBtn').style.display = 'block';
                document.getElementById('stopScanBtn').style.display = 'none';
            });
        }
    }

    function handleScannedPoint(p) {
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        document.getElementById('btn' + p).style.display = 'block';
        document.getElementById('scanStatus').innerText = "📍 พบจุดเช็คอิน: " + pointNames[p];
        speak("พบจุดเช็คอิน " + pointNames[p]);
    }

    async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value;
        const runnerName = localRunners[bib]?.name || 'นักวิ่ง';
        if(!bib) return alert('ใส่เลข BIB ก่อนครับ');
        
        if(!activeSession) {
            activeSession = { start: code, bib: bib };
            speak("บันทึกจุดเริ่มต้นให้คุณ " + runnerName + " แล้วค่ะ");
            alert("บันทึกจุดเริ่มแล้ว!");
            document.getElementById('btn' + code).style.display = 'none';
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) return alert("อยู่ที่จุดเดิมครับ");
            showLoading(true);
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: runnerName, start: activeSession.start, end: code, distance: dist })});
                speak("ยินดีด้วยค่ะคุณ " + runnerName + " เช็คอินสำเร็จ ระยะทางเพิ่ม " + dist + " กิโลเมตร");
                alert("สำเร็จ! ระยะเพิ่ม: " + dist + " กม.");
                activeSession = { start: code, bib: bib };
                document.getElementById('btn' + code).style.display = 'none';
            } catch(e) { alert("ผิดพลาด"); }
            showLoading(false);
        }
    }

    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value, name = document.getElementById('regName').value;
        showLoading(true);
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
            localRunners[bib] = { name: name };
            localStorage.setItem('runners_local', JSON.stringify(localRunners));
            document.getElementById('scanBib').value = bib;
            speak("ลงทะเบียนสำเร็จ ขอให้สนุกกับการวิ่งนะคะคุณ " + name);
            alert("ลงทะเบียนสำเร็จ!");
        } catch(e) { alert("ไม่สำเร็จ"); }
        showLoading(false);
    };

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
</script>
</body>
</html>
