<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE RUN SUNNY 2026 - Show-off Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #6f42c1; --accent: #00d2ff; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Prompt', sans-serif; min-height: 100vh; }
        .card { border: none; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .nav-pills .nav-link { color: #666; border-radius: 50px; white-space: nowrap; font-size: 0.9rem; padding: 10px 15px; }
        .nav-pills .nav-link.active { background: linear-gradient(45deg, #6f42c1, #8e44ad); box-shadow: 0 4px 15px rgba(111,66,193,0.3); }
        #reader { width: 100%; min-height: 300px; background: #000; border-radius: 20px; overflow: hidden; border: 4px solid #fff; }
        .btn-checkpoint { height: 70px; font-size: 1rem; font-weight: 600; border-radius: 20px; display: none; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .medal-hero { font-size: 4rem; display: block; margin: 10px 0; }
        .history-item { border-left: 4px solid var(--primary); margin-bottom: 10px; padding-left: 15px; background: #fff; border-radius: 10px; padding: 10px; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">FREE RUN SUNNY 2026 🏃‍♂️</h2>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-pill shadow-sm overflow-auto flex-nowrap" style="-webkit-overflow-scrolling: touch;">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-reg">1. ลงทะเบียน</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-run">2. สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stat" onclick="fetchDataFromCloud()">3. สถิติรวม</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-me">4. สถิติฉัน</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-reg">
            <div class="card p-4 mx-auto" style="max-width: 450px;">
                <h4 class="mb-4 fw-bold text-center text-primary">ลงทะเบียนนักวิ่ง</h4>
                <form id="regForm">
                    <div class="mb-3"><label class="form-label">เลข BIB</label><input type="text" id="regBib" class="form-control form-control-lg" placeholder="เช่น 303" required></div>
                    <div class="mb-3"><label class="form-label">ชื่อ-นามสกุล</label><input type="text" id="regName" class="form-control form-control-lg" placeholder="ใส่ชื่อภาษาไทย" required></div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">บันทึกและเริ่มวิ่ง</button>
                </form>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-run">
            <div class="card p-4 mx-auto" style="max-width: 500px;">
                <h5 class="text-center fw-bold mb-3">📍 เช็คอินจุดวิ่ง</h5>
                <input type="text" id="scanBib" class="form-control form-control-lg text-center mb-3 border-primary fw-bold" placeholder="เลข BIB">
                <div id="reader" class="mb-3"></div>
                <div class="d-grid gap-2 mb-3">
                    <button id="startScanBtn" class="btn btn-dark py-2 rounded-pill" onclick="startScanner()">📸 เปิดกล้อง</button>
                    <button id="stopScanBtn" class="btn btn-outline-danger py-2 rounded-pill" onclick="stopScanner()" style="display:none;">ปิดกล้อง</button>
                </div>
                <div id="scanStatus" class="alert alert-secondary text-center rounded-4 small">พร้อมสแกน...</div>
                <div id="btnArea">
                    <button id="btnA" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('A')">บันทึกจุด A</button>
                    <button id="btnB" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('B')">บันทึกจุด B</button>
                    <button id="btnC" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('C')">บันทึกจุด C</button>
                    <button id="btnD" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('D')">บันทึกจุด D</button>
                    <button id="btnE" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('E')">บันทึกจุด E</button>
                    <button id="btnF" class="btn btn-success btn-checkpoint w-100 mb-2" onclick="checkPoint('F')">บันทึกจุด F</button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-stat">
            <div class="card p-4">
                <div class="row mb-3">
                    <div class="col-8"><h5 class="fw-bold text-primary">🏆 Leaderboard</h5></div>
                    <div class="col-4 text-end"><button class="btn btn-sm btn-outline-primary" onclick="fetchDataFromCloud()">🔄 อัปเดต</button></div>
                </div>
                <input type="text" id="searchBox" class="form-control mb-3" placeholder="ค้นหาชื่อหรือ BIB..." onkeyup="filterTable()">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <tbody id="top10Body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-me">
            <div class="card p-4 mx-auto text-center" style="max-width: 500px;">
                <h5 class="fw-bold mb-3">My Stats - สถิติของฉัน</h5>
                <div class="input-group mb-4">
                    <input type="text" id="myBibSearch" class="form-control text-center fw-bold" placeholder="ใส่เลข BIB ของคุณ">
                    <button class="btn btn-primary" onclick="loadMyStats()">ดูข้อมูล</button>
                </div>
                
                <div id="myResultArea" style="display:none;">
                    <div class="bg-light p-3 rounded-4 mb-3 border">
                        <h4 id="myNameDisplay" class="fw-bold text-primary mb-1">-</h4>
                        <div class="text-muted mb-2">BIB: <span id="myBibDisplay">-</span></div>
                        <div id="myMedalDisplay" class="medal-hero">🏃‍♂️</div>
                        <div class="h3 fw-bold mb-0 text-dark"><span id="myDistDisplay">0.00</span> กม.</div>
                    </div>
                    
                    <h6 class="text-start fw-bold mb-3">📜 ประวัติการวิ่ง</h6>
                    <div id="myHistoryList" class="text-start"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvZHGKjK55cOMrBYtrkBisTUVSLrKTnqvmn6wYhzkdvAxFlDcjB286H0fhWNiVtOTu/exec";
    const distances = { 'A':0, 'B':0.5, 'C':1.0, 'D':2.0, 'E':2.5, 'F':4.0 };
    const pointNames = { 'A':'ทิชเชอร์แค้มป์', 'B':'ตำมิละ', 'C':'วัดหลวง', 'D':'เสาพญานาค', 'E':'วัดหาดไคร้', 'F':'ปลาบึกสีทอง' };
    
    let html5QrCode;
    let localRunners = JSON.parse(localStorage.getItem('runners_local')) || {};

    function speak(t) {
        if ('speechSynthesis' in window) {
            const m = new SpeechSynthesisUtterance(t); m.lang = 'th-TH'; window.speechSynthesis.speak(m);
        }
    }

    function getMedal(d) {
        if (d >= 100) return '🥇'; if (d >= 50) return '🥈'; if (d >= 20) return '🥉'; return '🏃‍♂️';
    }

    // --- ระบบ Tab 4: ดูข้อมูลส่วนตัว ---
    async function loadMyStats() {
        const bib = document.getElementById('myBibSearch').value;
        if(!bib) return alert('ใส่เลข BIB ก่อนครับ');
        
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let totalDist = 0;
            let name = "นักวิ่ง";
            let history = [];

            rows.slice(1).forEach(r => {
                if(r[2] == bib) {
                    name = r[3];
                    if(r[1] === 'RUN') {
                        totalDist += parseFloat(r[5] || 0);
                        history.unshift({ start: r[4], end: r[7], dist: r[5], time: r[0] });
                    }
                }
            });

            // แสดงผล
            document.getElementById('myNameDisplay').innerText = name;
            document.getElementById('myBibDisplay').innerText = bib;
            document.getElementById('myDistDisplay').innerText = totalDist.toFixed(2);
            document.getElementById('myMedalDisplay').innerText = getMedal(totalDist);
            
            let hHtml = history.map(h => `
                <div class="history-item">
                    <div class="d-flex justify-content-between fw-bold small">
                        <span>จาก ${h.start} ไป ${h.end}</span>
                        <span class="text-primary">+${h.dist} กม.</span>
                    </div>
                    <div style="font-size: 0.75rem" class="text-muted">เมื่อ: ${new Date(h.time).toLocaleString('th-TH')}</div>
                </div>
            `).join('');
            
            document.getElementById('myHistoryList').innerHTML = hHtml || '<div class="text-center text-muted">ยังไม่มีประวัติการวิ่ง</div>';
            document.getElementById('myResultArea').style.display = 'block';
            speak("ดึงข้อมูลของคุณ " + name + " เรียบร้อยแล้วค่ะ");
        } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ"); }
        showLoading(false);
    }

    // --- ฟังก์ชันเดิม (รวมไว้ให้ครบ) ---
    async function fetchDataFromCloud() {
        showLoading(true);
        const tbody = document.getElementById('top10Body');
        try {
            const res = await fetch(SCRIPT_URL);
            const rows = await res.json();
            let summary = {}, names = {};
            rows.slice(1).forEach(r => {
                const bib = r[2], name = r[3], dist = parseFloat(r[5] || 0);
                if(bib && name) names[bib] = name;
                if(r[1] === 'RUN' && bib) summary[bib] = (summary[bib] || 0) + dist;
            });
            const sorted = Object.entries(summary).sort((a,b) => b[1] - a[1]);
            tbody.innerHTML = sorted.map(([bib, d], i) => `
                <tr><td>${i+1}</td><td><span class="badge bg-dark">${bib}</span></td>
                <td>${names[bib]}</td><td>${getMedal(d)}</td><td class="text-end fw-bold">${d.toFixed(2)}</td></tr>
            `).join('');
        } catch(e) {}
        showLoading(false);
    }

    function filterTable() {
        let input = document.getElementById("searchBox").value.toLowerCase();
        let rows = document.getElementById("top10Body").getElementsByTagName("tr");
        for (let row of rows) row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
    }

    async function startScanner() {
        const cams = await Html5Qrcode.getCameras();
        if (cams.length > 0) {
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('stopScanBtn').style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const p = new URL(text).searchParams.get("point");
                if (p && pointNames[p]) { handleScannedPoint(p); stopScanner(); }
            });
        }
    }

    function stopScanner() {
        if (html5QrCode?.isScanning) html5QrCode.stop().then(() => {
            document.getElementById('startScanBtn').style.display = 'block';
            document.getElementById('stopScanBtn').style.display = 'none';
        });
    }

    function handleScannedPoint(p) {
        document.querySelectorAll('.btn-checkpoint').forEach(b => b.style.display = 'none');
        document.getElementById('btn' + p).style.display = 'block';
        document.getElementById('scanStatus').innerText = "📍 พบจุด: " + pointNames[p];
        speak("พบจุดเช็คอิน " + pointNames[p]);
    }

    async function checkPoint(code) {
        const bib = document.getElementById('scanBib').value;
        const name = localRunners[bib]?.name || 'นักวิ่ง';
        if(!bib) return alert('ใส่ BIB ก่อนครับ');
        if(!activeSession) {
            activeSession = { start: code, bib: bib };
            speak("บันทึกจุดเริ่มให้คุณ " + name); alert("เริ่มที่จุด " + code);
        } else {
            const dist = Math.abs(distances[code] - distances[activeSession.start]);
            if(dist === 0) return alert("จุดเดิมครับ");
            showLoading(true);
            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'record', bib: bib, name: name, start: activeSession.start, end: code, distance: dist })});
                speak("ยินดีด้วยค่ะคุณ " + name + " ระยะเพิ่ม " + dist + " กิโลเมตร");
                activeSession = { start: code, bib: bib };
            } catch(e) {}
            showLoading(false);
        }
    }

    document.getElementById('regForm').onsubmit = async (e) => {
        e.preventDefault();
        const bib = document.getElementById('regBib').value, name = document.getElementById('regName').value;
        showLoading(true);
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'register', bib: bib, name: name })});
            localRunners[bib] = { name: name };
            localStorage.setItem('runners_local', JSON.stringify(localRunners));
            document.getElementById('scanBib').value = bib;
            speak("ลงทะเบียนสำเร็จค่ะคุณ " + name);
        } catch(e) {}
        showLoading(false);
    };

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }
</script>
</body>
</html>
